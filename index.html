<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blox Dive Spear Fishing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9f3f7;--fg:#0b2a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07151d;--fg:#d8eef7}}
:root[data-theme="dark"]{--bg:#07151d;--fg:#d8eef7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
#wrap{position:relative;width:100%;max-width:1000px;aspect-ratio:16/10;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
@media (orientation:portrait){#wrap{aspect-ratio:3/4}}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:10px;color:#fff;font:bold 16px system-ui;text-shadow:0 1px 3px #000;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border:2px solid rgba(255,255,255,.8);border-radius:50%;pointer-events:none;display:none}
#air{position:absolute;left:50%;top:38px;width:min(240px,50%);height:12px;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;pointer-events:none}
#airf{height:100%;width:100%;background:#5fe0ff}
#flash{position:absolute;inset:0;background:#f00;opacity:0;transition:opacity .5s;pointer-events:none}
#pop{position:absolute;left:50%;top:60%;transform:translateX(-50%);font:bold 32px system-ui;text-shadow:0 2px 4px #000;opacity:0;pointer-events:none}
#pop.go{animation:up 1s ease-out}
@keyframes up{0%{opacity:1;top:60%}100%{opacity:0;top:45%}}
#bkb{position:absolute;right:12px;top:34px;display:none;padding:8px 12px;border-radius:8px;border:0;background:#8be9ff;font-weight:bold}#sb{position:absolute;right:12px;top:76px;display:none;padding:8px 12px;border-radius:8px;border:0;background:#ffd23f;font-weight:bold}
#ov{position:absolute;inset:0;background:rgba(0,20,40,.8);color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px;overflow:auto}
#ov>*:first-child{margin-top:auto}#ov>*:last-child{margin-bottom:auto}
#ov h1{margin:0;font-size:clamp(26px,5vw,42px)}#ov p{margin:0;font-size:clamp(13px,2.2vw,17px)}
#shop{display:grid;gap:6px;width:min(560px,100%)}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;text-align:left;font-size:14px}
.it i{font-style:normal;color:#ffd23f;letter-spacing:2px}.it span{opacity:.85}
.it button,#go,#bo2,#bkc{border:0;border-radius:8px;background:#ffd23f;color:#111;font-weight:bold;padding:6px 12px;cursor:pointer;grid-row:1/4;grid-column:2}
#go{grid-row:auto;font-size:18px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
#tc{position:absolute;bottom:10px;left:10px;right:10px;display:none;justify-content:space-between;pointer-events:none}
@media (pointer:coarse){#tc{display:flex}}
#tc div{display:flex;flex-direction:column;gap:8px}
.tb{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid #fff8;background:#0006;color:#fff;font-size:22px;touch-action:none}
#pop{white-space:nowrap}#fact{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(440px,92%);background:rgba(0,40,70,.9);color:#fff;border:2px solid #8be9ff;border-radius:10px;padding:10px 14px;font-size:14px;display:none;pointer-events:none}#fact b{color:#ffe066;display:block}#quiz{display:none;width:min(560px,100%);background:rgba(255,255,255,.12);border-radius:8px;padding:10px;font-size:14px}#quiz button{margin:3px;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}.fc{color:#ffe066;text-align:left;font-size:12px}#hp{position:absolute;left:50%;top:56px;width:min(240px,50%);height:12px;transform:translateX(-50%);background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;pointer-events:none}#hpf{height:100%;width:100%;background:#4cff6a}#bo2,#bkc{background:#8be9ff}
#book{position:absolute;inset:0;background:rgba(0,30,60,.94);color:#fff;display:none;flex-direction:column;align-items:center;gap:8px;padding:14px;overflow:auto}
#book h1{margin:0}#bkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;width:100%;max-width:960px}
.bk{background:rgba(255,255,255,.14);border-radius:8px;padding:10px;text-align:center;font-size:13px;display:flex;flex-direction:column;gap:4px}.bk.off{opacity:.45}
.sw{position:relative;width:56px;height:30px;border-radius:6px;margin:8px auto;background:#555}.sw i{position:absolute;left:-10px;top:6px;width:10px;height:18px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);color:#fff;background:#0007;padding:6px 12px;border-radius:8px;font-size:14px;pointer-events:none;display:none}
p.note{margin:0;font-size:13px;opacity:.8;text-align:center}

:root{--w1:#c98a4b;--w2:#a86a30;--dk:#4a2a12}
body,#wrap{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif}
.hud{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(var(--w1),var(--w2));border:3px solid var(--dk);border-radius:10px;padding:3px 10px;text-shadow:0 2px 0 var(--dk);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#air,#hp{height:18px;border:3px solid var(--dk);border-radius:12px;background:#2b1a0d;overflow:visible;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#air{top:12px;left:calc(50% + 10px)}#hp{top:42px;left:calc(50% + 10px)}
#airf,#hpf{border-radius:9px}
#airf{background:linear-gradient(#8be9ff,#1f9bd6)}#hpf{background:linear-gradient(#7dff7a,#1fb02b)}
#air i,#hp i{position:absolute;left:-18px;top:-6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;background:var(--w2);border:3px solid var(--dk);border-radius:50%;z-index:1}
#bkb{top:46px}#sb{top:88px}
#go,#bo2,#bkc,.it button,#sb,#bkb{background:linear-gradient(#ffe27a,#f2a11c)!important;color:var(--dk);border:3px solid var(--dk)!important;border-radius:10px;font-weight:900;box-shadow:0 3px 0 var(--dk)}
#go{background:linear-gradient(#8dff6a,#2fb32a)!important;color:#134a10;font-size:20px}
button:active{transform:translateY(2px)}
#ov,#book{background:rgba(25,12,3,.84)}
#ov h1,#book h1{background:linear-gradient(var(--w1),var(--w2));border:4px solid var(--dk);border-radius:12px;padding:6px 26px;color:#ffe27a;text-shadow:0 3px 0 var(--dk);box-shadow:0 4px 0 rgba(0,0,0,.4)}
#shop{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(var(--w1),var(--w2));border:4px solid var(--dk);border-radius:14px;padding:10px;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.it,.bk{background:linear-gradient(#7a4a22,#5e3718);border:3px solid var(--dk);color:#fff3d6}
.it i{color:#ffe27a}#coins{color:#ffe27a;text-shadow:0 2px 0 var(--dk)}
#quiz{background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--dk);color:#3a1f0a}#quiz button{background:#fff3d6;border:2px solid var(--dk)}
#fact{background:linear-gradient(#fff3d6,#f0d9a0);color:#3a1f0a;border:4px solid var(--dk)}#fact b{color:#a3480f}
#hint{background:linear-gradient(var(--w1),var(--w2));border:3px solid var(--dk)}
.tb{background:linear-gradient(#ffe27a,#f2a11c)!important;border:3px solid var(--dk)!important}

#uw{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(60,170,230,.12) 35%,rgba(8,60,130,.5) 100%);transition:opacity .25s}
#wt.u{background:linear-gradient(#3aa0e0,#1b6aa8)}
#wt.s{background:linear-gradient(#8dff6a,#2fb32a);color:#134a10;text-shadow:none}
#wt.a{background:linear-gradient(#ffe27a,#f2a11c);color:#4a2a12;text-shadow:none}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(800px,100%);background:linear-gradient(#8a5222,#6b3c18);border:4px solid #3a200c;border-radius:14px;padding:24px 10px 10px}
@media (max-width:640px){#shop{grid-template-columns:1fr}}
.col{position:relative;background:linear-gradient(#e9c98f,#d6a862);border:4px solid #4a2a12;border-radius:12px;padding:20px 8px 6px;display:flex;flex-direction:column;gap:2px}
.ch{position:absolute;top:-16px;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;background:linear-gradient(#7a4a22,#4a2a12);color:#ffe27a;border:3px solid #2a1606;border-radius:16px;padding:2px 18px;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.list{max-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px}
.card{display:grid;grid-template-columns:54px 1fr;gap:4px 10px;background:linear-gradient(#f6e6bd,#e6cd93);border:3px solid #7a4a22;border-radius:10px;padding:8px;color:#4a2a12;text-align:left;font-size:12px}
.ic{grid-row:1/3;width:54px;height:54px;border-radius:10px;border:3px solid #4a2a12;display:flex;align-items:center;justify-content:center;font-size:28px}
.mid{display:flex;flex-direction:column;gap:2px;line-height:1.25}
.lvb{align-self:flex-start;background:#4a2a12;color:#ffe27a;border-radius:8px;padding:0 8px;font-size:12px}
.buy{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pp{background:#3a200c;color:#ffe27a;border-radius:10px;padding:3px 10px;font-weight:bold;font-size:13px}
.buy button{grid-row:auto;grid-column:auto;background:linear-gradient(#5a5a5a,#222)!important;color:#fff!important;border:2px solid #111!important;border-radius:8px;padding:3px 12px;font-weight:bold;cursor:pointer;box-shadow:none}
.ar{background:none!important;border:0!important;box-shadow:none!important;color:#5a2f0c!important;font-size:16px;cursor:pointer;padding:0;line-height:1}
#coins{background:#3a200c;border:3px solid #2a1606;border-radius:12px;padding:3px 18px;font-size:22px!important}
#go{background:linear-gradient(#ffb02e,#ff7a00)!important;color:#fff!important;text-shadow:0 2px 0 #7a3800;font-size:22px;padding:8px 30px}
#go::before{content:'🤿 '}

#spc{position:absolute;left:12px;bottom:12px;display:none;padding:4px 16px;border-radius:12px;background:linear-gradient(var(--w1),var(--w2));border:4px solid var(--dk);color:#ffe27a;font:900 22px "Trebuchet MS",system-ui;text-shadow:0 2px 0 var(--dk);box-shadow:0 4px 0 rgba(0,0,0,.4);pointer-events:none}
#spc b{font-size:44px;color:#fff;margin-left:6px;vertical-align:middle;text-shadow:0 3px 0 var(--dk)}
@media (pointer:coarse){#spc{bottom:150px}}
.nos #shop,.nos #coins{display:none}

#prompt{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:none;padding:8px 18px;border-radius:14px;background:linear-gradient(var(--w1),var(--w2));border:4px solid var(--dk);color:#fff;font:900 20px "Trebuchet MS",system-ui;text-shadow:0 2px 0 var(--dk);box-shadow:0 4px 0 rgba(0,0,0,.4);pointer-events:none;white-space:nowrap;animation:pl 1.2s infinite}
#prompt b{background:#ffe27a;color:#4a2a12;border-radius:6px;padding:0 8px;text-shadow:none;margin:0 3px}
@keyframes pl{50%{transform:translateX(-50%) scale(1.06)}}

#home{position:absolute;inset:0;z-index:20;overflow:hidden;background:linear-gradient(#5dbcff 0%,#a9e2ff 30%,#e6f9ff 47%);transition:opacity .6s,transform .6s}
#home.out{opacity:0;transform:scale(1.06);pointer-events:none}
#hsun{position:absolute;right:10%;top:6%;width:clamp(70px,14vw,130px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#fffbe0 30%,#ffe98a 60%,#ffd54a);box-shadow:0 0 60px 30px rgba(255,235,140,.55);animation:sun 6s ease-in-out infinite alternate}
@keyframes sun{to{transform:scale(1.07)}}
.hcl{position:absolute;left:0;font-style:normal;font-size:clamp(40px,8vw,80px);opacity:.9;animation:cld 70s linear infinite}
@keyframes cld{from{transform:translateX(-20vw)}to{transform:translateX(130vw)}}
#hsea{position:absolute;left:0;right:0;top:52%;bottom:0;background:linear-gradient(#36cfe0,#0e86b8 45%,#08466e)}
.hw{position:absolute;left:0;right:0;height:32px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='32'><path d='M0 16Q40 0 80 16T160 16V32H0Z' fill='%2336cfe0'/></svg>") repeat-x;background-size:160px 32px;animation:hw 7s linear infinite}
.hw.w1{top:calc(52% - 30px)}.hw.w2{top:calc(52% - 22px);opacity:.6;animation-duration:11s;animation-direction:reverse}
.hw.w3{top:calc(52% - 31px);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='32'><path d='M0 16Q40 0 80 16T160 16' fill='none' stroke='white' stroke-opacity='.7' stroke-width='3'/></svg>");animation-duration:9s}
@keyframes hw{to{background-position:160px 0}}
.hf{position:absolute;left:105%;animation:hs linear infinite}.hf i{display:block;font-style:normal;animation:hb 2.5s ease-in-out infinite alternate}
@keyframes hs{to{transform:translateX(-135vw)}}@keyframes hb{to{transform:translateY(14px) rotate(-4deg)}}
.hbb{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:bu linear infinite}
@keyframes bu{to{transform:translateY(-70vh);opacity:0}}
#hboat{position:absolute;right:9%;top:calc(52% - 92px);width:clamp(150px,24vw,240px);animation:hbo 3.5s ease-in-out infinite alternate;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
@keyframes hbo{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(8px) rotate(2deg)}}
#htitle{position:absolute;left:0;right:0;top:3%;text-align:center;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
#htitle b{display:block;font:900 clamp(38px,9vw,84px)/1 "Trebuchet MS",system-ui;color:#fff;letter-spacing:3px;text-shadow:0 5px 0 #d35400,0 8px 0 #7a3800,0 12px 14px rgba(0,0,0,.3)}
#htitle small{display:inline-block;margin-top:8px;padding:2px 26px;font:900 clamp(16px,3.6vw,30px) "Trebuchet MS",system-ui;color:#fff;background:linear-gradient(#ff9d2e,#e5610a);border:4px solid #7a3800;border-radius:24px;text-shadow:0 2px 0 #7a3800}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}
#sign{position:absolute;left:4%;top:34%;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#sign button{width:clamp(190px,32vw,300px);padding:10px 30px 10px 22px;font:900 clamp(17px,3.2vw,28px) "Trebuchet MS",system-ui;color:#fff;text-align:left;text-shadow:0 3px 0 #4a2a12,0 0 6px #4a2a12;background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 3px,transparent 3px 11px),linear-gradient(#c98a4b,#96602c);border:0;cursor:pointer;clip-path:polygon(0 0,93% 0,100% 50%,93% 100%,0 100%);box-shadow:inset 0 0 0 4px #5c3413;animation:sl .7s cubic-bezier(.2,1.3,.4,1) both;transition:transform .18s,filter .18s}
#sign button:nth-child(2){animation-delay:.12s}#sign button:nth-child(3){animation-delay:.24s}#sign button:nth-child(4){animation-delay:.36s}
#sign button:hover{transform:translateX(14px) scale(1.04);filter:brightness(1.15)}#sign button:active{transform:translateX(14px) scale(.98)}
@keyframes sl{from{transform:translateX(-120%);opacity:0}}
#hMusic{position:absolute;right:12px;top:12px;width:48px;height:48px;border-radius:50%;border:4px solid #5c3413;background:linear-gradient(#ffe27a,#f2a11c);font-size:22px;cursor:pointer;z-index:2;transition:transform .15s}#hMusic:hover{transform:scale(1.1)}
#pn{position:absolute;inset:0;z-index:40;background:rgba(20,10,0,.6);display:none;align-items:center;justify-content:center;padding:14px}
.pnb{background:linear-gradient(#e9c98f,#d6a862);border:5px solid #4a2a12;border-radius:16px;padding:18px 20px 12px;width:min(520px,100%);color:#3a1f0a;text-align:center;animation:pp .3s ease both}
@keyframes pp{from{transform:scale(.85);opacity:0}}
.pnb h2{margin:-38px auto 12px;width:fit-content;background:linear-gradient(#7a4a22,#4a2a12);color:#ffe27a;border:3px solid #2a1606;border-radius:18px;padding:3px 24px}
.pnb ul{text-align:left;padding-left:18px;font-size:14px;line-height:1.5;margin:0 0 10px}
.pnb button{background:linear-gradient(#ffe27a,#f2a11c);border:3px solid #4a2a12;border-radius:10px;padding:6px 20px;font-weight:900;color:#4a2a12;cursor:pointer;margin:4px}
#ov{z-index:30}#book{z-index:35}
#warn{position:absolute;left:50%;top:104px;transform:translateX(-50%);display:none;padding:6px 16px;border-radius:12px;background:#b3131a;border:3px solid #ffd23f;color:#fff;font:900 16px "Trebuchet MS",system-ui;white-space:nowrap;pointer-events:none;animation:wr .5s infinite alternate}
@keyframes wr{to{background:#ff3b3b}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas><div id="uw"></div><canvas id="fx"></canvas><div id="flash"></div>
  <div id="cross"></div><div id="pop"></div>
  <div class="hud" style="left:12px" id="sc"></div>
  <div class="hud" style="left:12px;top:48px;font-size:13px" id="bs"></div>
  <div class="hud" style="right:12px" id="dp"></div><div class="hud u" id="wt" style="left:12px;top:84px;font-size:13px"></div>
  <div id="air"><i>🫧</i><div id="airf"></div></div><div id="hp"><i>❤️</i><div id="hpf"></div></div>
  <button id="bkb">Book (B)</button><button id="sb">Boat Shop (E)</button><div id="warn"></div><div id="prompt"></div><div id="spc">SPEARS: <b id="spn">5</b></div><div id="fact"></div><div id="hint">Click to lock mouse</div>
  <div id="tc"><div><button class="tb" id="bu">&#9650;</button><button class="tb" id="bd">&#9660;</button></div><div><button class="tb" id="bt">&#128305;</button><button class="tb" id="bf">&#10148;</button></div></div>
  <div id="ov" class="nos" style="display:none"><h1 id="t1">Blox Dive Spear Fishing</h1><p id="t2"></p><div id="quiz"></div><div id="coins" style="font-size:20px;font-weight:bold"></div><div id="shop"></div><button id="go">Play</button><button id="bo2">Fish Book</button></div>
  <div id="home"><div id="hsun"></div><i class="hcl" style="top:9%;animation-delay:-10s">☁️</i><i class="hcl" style="top:20%;animation-delay:-38s;font-size:50px">☁️</i>
 <div id="hsea"></div><div class="hw w1"></div><div class="hw w2"></div><div class="hw w3"></div><div id="hfish"></div><div id="hbub"></div>
 <svg id="hboat" viewBox="0 0 220 120"><path d="M10 70h190l-25 32H38z" fill="#c0392b"/><path d="M14 70h182l-4 8H18z" fill="#fff"/><rect x="70" y="36" width="60" height="34" fill="#fff"/><rect x="66" y="30" width="68" height="8" fill="#d63031"/><rect x="78" y="44" width="16" height="14" fill="#9fe6ff"/><rect x="106" y="44" width="16" height="14" fill="#9fe6ff"/><rect x="152" y="12" width="4" height="58" fill="#8b5a2b"/><path d="M156 12l38 12-38 12z" fill="#e74c3c"/></svg>
 <div id="htitle"><b>BLOX DIVE</b><small>SPEAR FISHING</small></div>
 <div id="sign"><button id="hPlay">▶ PLAY</button><button id="hShop">🛒 SHOP</button><button id="hSet">⚙ SETTINGS</button><button id="hHow">📖 HOW TO PLAY</button></div>
 <button id="hMusic" title="Music">🔊</button></div>
 <div id="pn"><div class="pnb"><h2 id="pnt"></h2><div id="pnc"></div><button id="pnx">Back</button></div></div>
 <div id="book"><h1>Fish Book</h1><p id="bkp"></p><div id="bkg"></div><button id="bkc">Close</button></div>
</div>
<p class="note">Click to lock your mouse, then move to look. WASD swim, Space up, Shift down, click or F to throw, B for the Fish Book, M for music, E at the boat to board &amp; shop, Esc frees the mouse.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),wrap=$('wrap'),V3=THREE.Vector3,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
const scene=new THREE.Scene(),SEA=new THREE.Color(0x2bb5e8),DEEP=new THREE.Color(0x03162b);
scene.background=SEA.clone();scene.fog=new THREE.FogExp2(0x2bb5e8,0.009);
const cam=new THREE.PerspectiveCamera(76,1.6,0.1,140);cam.rotation.order='YXZ';scene.add(cam);

try{musicOn=localStorage.getItem('bdMusic')!=='0'}catch(e){}
const CH=[[220,261.63,329.63,493.88],[174.61,220,261.63,329.63],[130.81,164.81,196,246.94],[196,246.94,293.66,329.63]];
function getAC(){return AC=AC||new(window.AudioContext||window.webkitAudioContext)()}
function chord(t,i){const a=AC,C=CH[i];
  C.forEach((f,k)=>[f,f*1.004].forEach((ff,j)=>{const o=a.createOscillator(),g=a.createGain();o.type=j?'triangle':'sine';o.frequency.value=ff;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+2.5);g.gain.linearRampToValueAtTime(.03,t+6);g.gain.linearRampToValueAtTime(0,t+9.5);o.connect(g);g.connect(mg);o.start(t);o.stop(t+9.6)}));
  {const o=a.createOscillator(),g=a.createGain();o.frequency.value=C[0]/2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+2);g.gain.linearRampToValueAtTime(0,t+9.5);o.connect(g);g.connect(mg);o.start(t);o.stop(t+9.6)}
  [1,2.5,4,5.5,6.8].forEach(d=>{const o=a.createOscillator(),g=a.createGain(),st=t+d;o.frequency.value=C[Math.floor(Math.random()*4)]*2;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.05,st+.03);g.gain.exponentialRampToValueAtTime(.001,st+1.8);o.connect(g);g.connect(mg);o.start(st);o.stop(st+1.9)})}
function musicTick(){const a=AC;if(!a||a.state!=='running')return;if(mNext<a.currentTime)mNext=a.currentTime+.1;while(mNext<a.currentTime+2){chord(mNext,mIdx++%4);mNext+=8}}
function startMusic(){try{const a=getAC();if(a.state==='suspended')a.resume();if(musicStarted)return;musicStarted=true;
  mg=a.createGain();mg.gain.value=musicOn?mvol:0;mg.connect(a.destination);
  const nb=a.createBuffer(1,a.sampleRate*3,a.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=a.createBufferSource();ns.buffer=nb;ns.loop=true;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  const ng=a.createGain();ng.gain.value=.05;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=.12;lg.gain.value=.03;lfo.connect(lg);lg.connect(ng.gain);lfo.start();
  ns.connect(lp);lp.connect(ng);ng.connect(mg);ns.start();mNext=a.currentTime+.2;setInterval(musicTick,500)}catch(e){}}
function setMusic(on){musicOn=on;try{localStorage.setItem('bdMusic',on?'1':'0')}catch(e){}
  if(mg)mg.gain.setTargetAtTime(on?mvol:0,AC.currentTime,.3);$('hMusic').textContent=on?'🔊':'🔇';const b=$('musicBtn');if(b)b.textContent='🎵 Music: '+(on?'ON':'OFF');startMusic()}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,startMusic));startMusic();

// ===== home screen, settings, how to play =====
let homeUp=true;
{const F=['🐟','🐠','🐡','🐟','🐠','🐟','🐡','🐠'],hf=$('hfish');
 F.forEach((e,i)=>{const d=document.createElement('span');d.className='hf';d.style.cssText='top:'+(58+Math.random()*32)+'%;font-size:'+(22+Math.random()*26)+'px;animation-duration:'+(16+Math.random()*18)+'s;animation-delay:-'+(Math.random()*30)+'s';d.innerHTML='<i>'+e+'</i>';hf.appendChild(d)});
 for(let i=0;i<18;i++){const b=document.createElement('span'),z=6+Math.random()*14;b.className='hbb';b.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(6+Math.random()*8)+'s;animation-delay:-'+Math.random()*10+'s';$('hbub').appendChild(b)}}
function hideHome(){homeUp=false;$('home').classList.add('out');setTimeout(()=>{if(!homeUp)$('home').style.display='none'},650)}
function panel(t,h){$('pnt').textContent=t;$('pnc').innerHTML=h;$('pn').style.display='flex'}
$('pnx').onclick=()=>$('pn').style.display='none';
$('hPlay').onclick=()=>{startMusic();lockMouse();hideHome();startDive()};
$('hShop').onclick=()=>{startMusic();show('Shop','Coins are earned while diving. Progress resets when you close the tab.','Back')};
$('hMusic').onclick=()=>setMusic(!musicOn);
$('hSet').onclick=()=>{panel('Settings','<p><button id="musicBtn"></button></p><p>Volume <input type="range" id="vol" min="0" max="100" value="'+Math.round(mvol*1000)+'"></p><p style="font-size:13px">Progress is kept only while this tab is open.</p>');
  $('musicBtn').textContent='🎵 Music: '+(musicOn?'ON':'OFF');$('musicBtn').onclick=()=>setMusic(!musicOn);
  $('vol').oninput=e=>{mvol=e.target.value/1000;if(mg&&musicOn)mg.gain.setTargetAtTime(mvol,AC.currentTime,.1)}};
$('hHow').onclick=()=>panel('How to Play','<ul><li><b>Swim:</b> W A S D, Space = up, Shift = down</li><li><b>Look:</b> move the mouse (click to lock), or drag / arrow keys</li><li><b>Throw a spear:</b> click, F or Enter</li><li><b>Boat &amp; shop:</b> swim next to the boat, press E to board, then E again for the shop</li><li><b>Items:</b> 1 Medkit, 2 Air Pack, 3 Spear Pack</li><li><b>Fish Book:</b> B &nbsp; <b>Music:</b> M</li><li>Green <b>LVL</b> badge = you can catch it. Red 🔒 = upgrade Spear Power first.</li><li>Surface to breathe. Beware sharks, electric eels and the Giant Squid!</li></ul>');
$('hMusic').textContent=musicOn?'🔊':'🔇';
cam.position.copy(pl);shop();hud();
$('t2').textContent='Swim, spear fish for coins, and upgrade your gear. Run out of air and the dive ends - swim to the surface to breathe!';
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.05);last=n;try{update(dt)}catch(e){console.error(e)}if(!homeUp){renderer.render(scene,cam);try{fxDraw(dt)}catch(e){}}}
requestAnimationFrame(loop);
</script>
</body>
